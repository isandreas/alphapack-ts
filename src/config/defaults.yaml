# Per-group default settings skeleton.
#
# Shape is intentionally minimal for Phase 0.
# Later phases extend this object with their own keys.
# getGroupSettings(chatId) in middlewares/group-settings.ts merges
# Redis overrides on top of these defaults at runtime.

# Locale for this group's bot replies ("id" | "en")
locale: id

# --- Custom Name ---
# Set via BOT_CUSTOM_NAME env var. Defaults to "Alpha Pack".
# customBotName is no longer a per-group setting.

# --- Rules ---
rules:
  text: null               # null = "no rules set yet" i18n fallback

# --- Guide ---
guide:
  text: null               # null = "no guide set yet" i18n fallback

# --- Moderation (Phase 5) ---
moderation:
  warn:
    enabled: false
  tban:
    enabled: false
  ban:
    enabled: false
  mute:
    enabled: false

# --- Moderation (Phase 2) ---
warnThreshold: 5       # auto-action after N warns
logChannelId: null     # Telegram channel ID for audit logs (null = disabled)
banMessage:
  enabled: false
  template: ""
tbanMessage:
  enabled: false
  template: ""

# --- Features toggle map (Phase 2+) ---
# Each key corresponds to a feature module. Set false to disable globally.
features: {}

# --- Anti-Spam (Phase 2) ---
floodGuard:
  enabled: false       # Gated default OFF per cutover rollout spec
  windowSeconds: 3
  messageThreshold: 5
  punishment:
    type: mute
    durationSeconds: 60

# --- Welcome, Goodbye & Captcha Gate (Phase 3) ---
welcome:
  enabled: false       # Gated default OFF per cutover rollout spec
  template: |
    Pujaan ku {user_displayname}, lama sekali kutunggu hadirmu, cintamu bagai bunga pasir yang timbul dan tenggelam...
    peluk hangat dari {group_name} 🎉🎉🎉

    🪪 {user_id}
    📮 {user_username}

    Jangan lupa baca /rules dan /guide ya.. 🤗
  captcha:
    enabled: false
    timeoutSeconds: 60
goodbye:
  enabled: false       # Gated default OFF per cutover rollout spec
  template: "{user_displayname} has left {group_name}."

# --- Mentions & Reports (Phase 4) ---
mentions:
  adminRelay:
    enabled: false     # Gated default OFF per cutover rollout spec
    cooldownSeconds: 60
  userNotify:
    enabled: false     # Gated default OFF per cutover rollout spec
    cooldownSeconds: 30
